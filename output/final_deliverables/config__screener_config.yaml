# ============================================================
# NIFTY 100 SCREENER CONFIGURATION
# Sprint 3 - Day 15 / Day 16
# ============================================================

filters:

  roe_min:
    column: return_on_equity_pct
    operator: ">="
    description: "Minimum Return on Equity (%)"

  de_max:
    column: debt_to_equity
    operator: "<="
    description: "Maximum Debt to Equity"

  de_exact:
    column: debt_to_equity
    operator: "=="
    description: "Exact Debt to Equity"

  fcf_min:
    column: free_cash_flow_cr
    operator: ">="
    description: "Minimum Free Cash Flow (Cr)"

  revenue_cagr_3yr_min:
    column: revenue_cagr_3yr
    operator: ">="
    description: "Minimum 3-Year Revenue CAGR (%)"

  revenue_cagr_5yr_min:
    column: revenue_cagr_5yr
    operator: ">="
    description: "Minimum 5-Year Revenue CAGR (%)"

  pat_cagr_5yr_min:
    column: pat_cagr_5yr
    operator: ">="
    description: "Minimum 5-Year PAT CAGR (%)"

  eps_cagr_min:
    column: eps_cagr_5yr
    operator: ">="
    description: "Minimum 5-Year EPS CAGR (%)"

  opm_min:
    column: operating_profit_margin_pct
    operator: ">="
    description: "Minimum Operating Profit Margin (%)"

  pe_max:
    column: pe_ratio
    operator: "<="
    description: "Maximum P/E"

  pb_max:
    column: pb_ratio
    operator: "<="
    description: "Maximum P/B"

  dividend_yield_min:
    column: dividend_yield_pct
    operator: ">="
    description: "Minimum Dividend Yield (%)"

  dividend_payout_max:
    column: dividend_payout_ratio_pct
    operator: "<="
    description: "Maximum Dividend Payout (%)"

  icr_min:
    column: interest_coverage
    operator: ">="
    description: "Minimum Interest Coverage Ratio"

  market_cap_min:
    column: market_cap_crore
    operator: ">="
    description: "Minimum Market Capitalisation (Cr)"

  net_profit_min:
    column: net_profit
    operator: ">="
    description: "Minimum Net Profit (Cr)"

  asset_turnover_min:
    column: asset_turnover
    operator: ">="
    description: "Minimum Asset Turnover"

  sales_min:
    column: sales
    operator: ">="
    description: "Minimum Sales (Cr)"


# ============================================================
# PRESET SCREENERS
# ============================================================

presets:

  Quality Compounder:

    filters:
      roe_min: 12
      de_max: 1
      fcf_min: 0
      revenue_cagr_5yr_min: 10

    sort_by: composite_quality_score
    ascending: false


  Value Pick:

    filters:
      pe_max: 30
      pb_max: 5
      de_max: 2
      dividend_yield_min: 1.5

    sort_by: composite_quality_score
    ascending: false


  Growth Accelerator:

    filters:
      pat_cagr_5yr_min: 20
      revenue_cagr_5yr_min: 15
      de_max: 2

    sort_by: composite_quality_score
    ascending: false


  Dividend Champion:

    filters:
      dividend_yield_min: 1.5
      dividend_payout_max: 80
      fcf_min: 0

    sort_by: composite_quality_score
    ascending: false


  Debt-Free Blue Chip:

    filters:
      de_exact: 0
      roe_min: 12
      sales_min: 5000

    sort_by: composite_quality_score
    ascending: false


  Turnaround Watch:

    filters:
      revenue_cagr_3yr_min: 10
      fcf_positive_latest: true
      de_declining_yoy: true

    sort_by: composite_quality_score
    ascending: false